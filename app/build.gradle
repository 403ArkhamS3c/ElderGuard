plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.elderguard.watch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elderguard.watch'
        minSdk 30 // Minimal untuk Wear OS 3 (Galaxy Watch 4)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
